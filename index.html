<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1410" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Menus" />
  <meta name="description" content="Snowpiercer visual food combination author" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="fonts/figtree.css" />
  <link rel="stylesheet" href="css/app.css" />
  <title>Food Menus</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <p class="brand-name">Food Menus</p>
        </div>
        <div class="top-actions">
          <button type="button" class="chip-btn" id="btn-dishes" title="Browse dishes">Dishes</button>
          <button type="button" class="icon-btn" id="btn-gallery" title="Art gallery" aria-label="Art gallery">▦</button>
          <button type="button" class="icon-btn" id="btn-kept" title="Kept plates" aria-label="Kept plates">
            ♥<span id="kept-count">0</span>
          </button>
          <button type="button" class="chip-btn" id="btn-sync-pull" title="Pull sheet into widget">Pull</button>
          <button type="button" class="chip-btn accent" id="btn-save-drive" title="Push dirty rows to sheet / JSON">Save</button>
          <a class="chip-btn" id="btn-food-master" title="Open Food Master spreadsheet"
            href="https://docs.google.com/spreadsheets/d/1ShKoeUKdthTgd6Y2zmAyNkUiv0wpkqmOyaZ1D_TX7DQ/edit"
            target="_blank" rel="noopener noreferrer">Food Master</a>
        </div>
      </div>
      <p class="drive-status muted" id="drive-status" hidden></p>
    </header>

    <!-- HOME: plate + locker -->
    <main id="view-home" class="view">
      <div class="mode-rail" role="tablist" aria-label="Authoring mode">
        <button type="button" class="mode-chip active" id="mode-dish" data-mode="dish">Create dish</button>
        <button type="button" class="mode-chip" id="mode-ingredient" data-mode="ingredient">Create ingredient</button>
      </div>

      <section class="plate-stage" id="plate-stage" aria-label="Basic dish plate">
        <div class="plate-glow" aria-hidden="true"></div>
        <div class="plate-bowl" id="plate-bowl" data-drop="plate">
          <div class="plate-rim"></div>
          <div class="plate-well" id="plate-stack"></div>
          <p class="plate-empty" id="plate-empty">Tap food onto the plate</p>
        </div>
        <label class="dish-name-wrap" for="dish-name">
          <span class="sr-only">Dish name</span>
          <input type="text" id="dish-name" class="dish-name-input" maxlength="80"
            placeholder="Dish name" autocomplete="off" enterkeyhint="done" />
        </label>
        <div class="plate-meters" id="plate-meters"></div>
        <ul class="recipe-list" id="recipe-list" aria-label="Recipe ingredients"></ul>
        <section class="slots-section" id="slots-section" aria-label="Flexible slots">
          <h3 class="slots-heading">Slots</h3>
          <div class="slot-add-rail" id="slot-add-rail" aria-label="Add slot"></div>
          <label class="slot-custom-wrap" for="slot-custom-name">
            <span class="sr-only">Custom slot name</span>
            <input type="text" id="slot-custom-name" class="slot-custom-input" maxlength="32"
              placeholder="Custom slot name" autocomplete="off" enterkeyhint="done" />
            <button type="button" class="chip-btn" id="btn-add-custom-slot">Add</button>
          </label>
          <div class="recipe-slots" id="recipe-slots" aria-label="Recipe slots"></div>
        </section>
        <div class="restaurant-rail" id="restaurant-rail" aria-label="Restaurant tag"></div>
        <div class="plate-actions">
          <button type="button" class="ghost-round" id="btn-clear-tray" aria-label="Clear plate">✕</button>
          <button type="button" class="cook-btn" id="btn-create-dish" disabled>Create dish</button>
        </div>
        <p class="plate-hint" id="tray-hint"></p>
      </section>

      <!-- Create ingredient authoring (same visual language) -->
      <section class="ingredient-author hidden" id="ingredient-author" aria-label="Create ingredient">
        <label class="dish-name-wrap" for="output-name">
          <span class="sr-only">Output ingredient</span>
          <input type="text" id="output-name" class="dish-name-input" maxlength="80"
            placeholder="Output ingredient name" autocomplete="off" list="process-output-list" />
          <datalist id="process-output-list"></datalist>
        </label>
        <div class="station-rail" id="station-rail" aria-label="Stations"></div>
        <label class="locker-search-wrap process-search-wrap" for="process-search">
          <span class="sr-only">Search processes</span>
          <input type="search" id="process-search" class="locker-search" placeholder="Search processes…"
            autocomplete="off" enterkeyhint="search" />
        </label>
        <div class="process-picker" id="process-picker" aria-label="Process recipes"></div>
        <div class="process-chain-view" id="process-chain-view" aria-label="Process chain"></div>
        <ul class="process-slots" id="process-slots" aria-label="Required inputs"></ul>
        <div class="shelf-compare" id="shelf-compare" hidden></div>
        <div class="plate-actions">
          <button type="button" class="ghost-round" id="btn-clear-process" aria-label="Clear inputs">✕</button>
          <button type="button" class="cook-btn" id="btn-create-ingredient" disabled>Create ingredient</button>
        </div>
        <p class="plate-hint" id="process-hint"></p>
      </section>

      <section class="locker">
        <label class="locker-search-wrap" for="locker-search">
          <span class="sr-only">Search ingredients</span>
          <input type="search" id="locker-search" class="locker-search" placeholder="Search ingredients…"
            autocomplete="off" enterkeyhint="search" />
        </label>
        <div class="locker-filter-row">
          <div class="stage-rail" id="stage-rail" aria-label="Use tree filter">
            <button type="button" class="stage-chip active" data-stage="all">All</button>
            <button type="button" class="stage-chip" data-stage="dish">Dish</button>
            <button type="button" class="stage-chip" data-stage="processed">Processed</button>
            <button type="button" class="stage-chip" data-stage="fresh">Fresh</button>
            <button type="button" class="stage-chip" data-stage="raw">Raw</button>
          </div>
          <div class="form-rail" id="form-rail" aria-label="Form filter">
            <button type="button" class="form-chip" data-form="sliced" aria-label="Sliced" aria-pressed="false" title="Sliced">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M3.2 20.2c-.4.4-.4 1 0 1.4.4.4 1 .4 1.4 0L14 12.2l1.1-1.1-2.2-2.2L3.2 20.2zm17.1-12.4c.9-.9.9-2.3 0-3.2-.9-.9-2.3-.9-3.2 0l-1.3 1.3 3.2 3.2 1.3-1.3zM14.6 6.3l-1.5 1.5 3.2 3.2 1.5-1.5-3.2-3.2z"/>
              </svg>
            </button>
            <button type="button" class="form-chip" data-form="diced" aria-label="Diced" aria-pressed="false" title="Diced">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                <rect x="3" y="3" width="8" height="8" rx="1.5" fill="currentColor"/>
                <rect x="13" y="3" width="8" height="8" rx="1.5" fill="currentColor"/>
                <rect x="3" y="13" width="8" height="8" rx="1.5" fill="currentColor"/>
                <rect x="13" y="13" width="8" height="8" rx="1.5" fill="currentColor"/>
              </svg>
            </button>
            <button type="button" class="form-chip" data-form="unit" aria-label="Single units" aria-pressed="false" title="Single units">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                <rect x="7" y="7" width="10" height="10" rx="2.5" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="type-rail" id="type-rail" aria-label="Ingredient types"></div>
        <div class="family-tabs" id="family-tabs" role="tablist"></div>
        <div id="ingredient-grid" class="ing-grid" aria-live="polite"></div>
      </section>
    </main>

    <!-- DISHES browse: complete dishes as equations (dish = ingredients) -->
    <main id="view-dishes" class="view hidden">
      <button type="button" class="back-btn" id="btn-back-from-dishes">← Locker</button>
      <label class="locker-search-wrap" for="dishes-search" style="padding:0 0.85rem">
        <span class="sr-only">Search dishes</span>
        <input type="search" id="dishes-search" class="locker-search" placeholder="Search dishes…"
          autocomplete="off" enterkeyhint="search" />
      </label>
      <div id="dishes-browse" class="dishes-browse" role="list" aria-label="Complete dishes as equations"></div>
    </main>

    <!-- DISH: finished plate + visual variations -->
    <main id="view-dish" class="view hidden">
      <button type="button" class="back-btn" id="btn-back-home">← Locker</button>
      <section class="dish-stage" id="dish-hero"></section>
      <section class="var-rail-wrap">
        <div class="var-rail-head">
          <h2>Variations</h2>
          <button type="button" class="chip-btn accent" id="btn-add-variation">＋</button>
        </div>
        <div id="variation-list" class="var-rail"></div>
      </section>
      <section class="dish-actions">
        <button type="button" class="action keep" id="btn-keep">Keep</button>
        <button type="button" class="action discard" id="btn-discard">Discard</button>
      </section>
    </main>

    <!-- KEPT plates -->
    <main id="view-kept" class="view hidden">
      <button type="button" class="back-btn" id="btn-back-from-kept">← Locker</button>
      <div id="kept-list" class="kept-rail"></div>
      <button type="button" class="chip-btn" id="btn-export" style="margin:1rem">Download JSON</button>
    </main>

    <!-- ART GALLERY: present vs missing -->
    <main id="view-gallery" class="view hidden">
      <button type="button" class="back-btn" id="btn-back-from-gallery">← Locker</button>
      <div class="gallery-tabs">
        <button type="button" class="family-tab active" data-gal="have" id="gal-have">Painted</button>
        <button type="button" class="family-tab" data-gal="untitled" id="gal-untitled">Untitled</button>
        <button type="button" class="family-tab" data-gal="miss" id="gal-miss">Missing</button>
        <button type="button" class="family-tab" data-gal="flag" id="gal-flagged">Flagged</button>
      </div>
      <label class="locker-search-wrap gallery-search-wrap" for="gallery-search">
        <span class="sr-only">Search gallery</span>
        <input type="search" id="gallery-search" class="locker-search" placeholder="Search art…"
          autocomplete="off" enterkeyhint="search" />
      </label>
      <div id="gallery-grid" class="ing-grid gallery-grid"></div>
    </main>
  </div>

  <dialog id="detail-dialog">
    <form method="dialog" class="dialog-card visual-detail">
      <div id="detail-body"></div>
      <menu>
        <button value="cancel" class="chip-btn">Close</button>
        <button value="toggle" class="chip-btn accent" id="detail-toggle">Add</button>
      </menu>
    </form>
  </dialog>

  <dialog id="meters-dialog">
    <form method="dialog" class="dialog-card">
      <h2 id="meters-dialog-title">Meters</h2>
      <div id="meters-breakdown" class="stars-breakdown"></div>
      <menu>
        <button value="ok" class="chip-btn accent">Done</button>
      </menu>
    </form>
  </dialog>

  <dialog id="variation-dialog">
    <form method="dialog" class="dialog-card">
      <h2>Swap on the plate</h2>
      <div id="variation-options" class="variation-options visual-opts"></div>
      <menu>
        <button value="cancel" class="chip-btn">Cancel</button>
      </menu>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/five-star.js"></script>
  <script src="js/process.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/drive-save.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
